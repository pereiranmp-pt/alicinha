<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALICINHA na Terra do NUNCA … O LEGADO</title>
<style>
:root { --bg: #fdf8f0; --fg: #2b2338; --accent: #7a4fb0; --card: #ffffff; --muted: #7d7490; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1d1828; --fg: #f3eefb; --accent: #b89be0; --card: #2a2339; --muted: #a79dbd; }
}
:root[data-theme="dark"] { --bg: #1d1828; --fg: #f3eefb; --accent: #b89be0; --card: #2a2339; --muted: #a79dbd; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: Georgia, serif; line-height: 1.4; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.6rem; text-align: center; color: var(--accent); margin: 16px 0 28px; }
.card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card h2 { font-size: 1.05rem; margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.card > div { min-width: 0; }
.btn { flex-shrink: 0; background: var(--accent); color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 999px; font-family: system-ui, sans-serif; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>ALICINHA na Terra do NUNCA … O LEGADO</h1>
  <section class="card">
    <div>
      <h2>O Apolo</h2>
      <p>O escritório</p>
    </div>
    <a class="btn" href="https://maps.app.goo.gl/dLoCfyzLJBy4AxpA6" target="_blank" rel="noopener">Mapa</a>
  </section>
  <section class="card">
    <div>
      <h2>Noite e Dia</h2>
      <p>Almoço de 5.ª</p>
    </div>
    <a class="btn" href="https://maps.app.goo.gl/QGEzUPrAEHNgcQ1v6" target="_blank" rel="noopener">Mapa</a>
  </section>
  <section class="card">
    <div>
      <h2>Braçal… profundo</h2>
      <p>Jantar de 5.ª</p>
    </div>
    <a class="btn" href="https://goo.gl/maps/tAeU6QHJ9CnCXQAA6" target="_blank" rel="noopener">Mapa</a>
  </section>
  <section class="card">
    <div>
      <h2>Lagar</h2>
      <p>A Tiborna!!</p>
    </div>
    <a class="btn" href="https://maps.app.goo.gl/zFyp6pTPuGqeiXMi6" target="_blank" rel="noopener">Mapa</a>
  </section>
  <section class="card">
    <div>
      <h2>Igreja das Moitas</h2>
      <p>Sábado, descanso e feijoada</p>
    </div>
    <a class="btn" href="https://goo.gl/maps/uYmB4W3HbqAe7VPQ9" target="_blank" rel="noopener">Mapa</a>
  </section>
</main>
</body>
</html>
